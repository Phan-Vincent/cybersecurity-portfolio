title: Shell History Cleared Or Disabled
id: b2eb83e0-525d-4949-b5f4-5160e6c6fe92
name: linux_history_tampering
status: test
author: Vincent Phan
date: 2026-11-03
description: Commands that wipe or stop recording shell history, which attackers use to hide their steps.
references:
  - https://attack.mitre.org/techniques/T1070/003/
tags:
  - attack.stealth
  - attack.t1070.003
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'history -c'
      - 'unset HISTFILE'
      - 'HISTFILE=/dev/null'
      - 'rm ~/.bash_history'
      - 'rm -f ~/.bash_history'
      - '/dev/null ~/.bash_history'
  condition: selection
falsepositives:
  - Rare; users clearing history after pasting a secret (still worth a conversation)
level: medium
