
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[PowerShell With An Encoded Command]
description = PowerShell launched with -EncodedCommand or one of its abbreviations, which hides the script from command-line logging.
search = Image IN ("*\\powershell.exe", "*\\pwsh.exe") CommandLine IN ("* -e *", "* -ec *", "* -en *", "* -enc *", "* -enco*", "* /e *", "* /enc *")

[Shadow Copies Deleted Or Recovery Disabled]
description = Deleting Volume Shadow Copies or disabling Windows recovery, a step most ransomware takes right before encrypting.
search = (Image="*\\vssadmin.exe" CommandLine="*delete*" CommandLine="*shadows*") OR (Image="*\\wmic.exe" CommandLine="*shadowcopy*" CommandLine="*delete*") OR (Image="*\\bcdedit.exe" CommandLine="*recoveryenabled no*")

[LSASS Memory Dump]
description = Dumping LSASS process memory with comsvcs.dll MiniDump or Sysinternals ProcDump to harvest credentials.
search = (CommandLine="*comsvcs*" CommandLine="*MiniDump*") OR (Image IN ("*\\procdump.exe", "*\\procdump64.exe") CommandLine="*lsass*")

[PHI Uploaded To Personal Cloud Storage]
description = An upload to a personal (unsanctioned) cloud storage service where the DLP engine matched patient identifiers.
search = http_method IN ("POST", "PUT") url_category="personal_cloud_storage" dlp_match IN ("*ssn*", "*mrn*", "*dob*")

[Shell History Cleared Or Disabled]
description = Commands that wipe or stop recording shell history, which attackers use to hide their steps.
search = CommandLine IN ("*history -c*", "*unset HISTFILE*", "*HISTFILE=/dev/null*", "*rm ~/.bash_history*", "*rm -f ~/.bash_history*", "*/dev/null ~/.bash_history*")

[Linux Reverse Shell Command Line]
description = Interactive shells redirected to a network socket, the classic post-exploitation callback.
search = CommandLine IN ("*/dev/tcp/*", "*/dev/udp/*", "*nc -e *", "*ncat -e *", "*socat exec:*", "*pty.spawn(*")

[Cron Job Created Or Replaced]
description = A crontab installed or edited from the command line, or a file written into /etc/cron.d. Listing a crontab is ignored.
search = (Image="*/crontab" NOT CommandLine="* -l*") OR (CommandLine="*/etc/cron.d/*" CommandLine="*echo*" CommandLine="*>*")

[Successful SSH Login As Root]
description = Direct root logins should be disabled (PermitRootLogin no); a success means the control is off or bypassed.
search = action="login" outcome="success" user="root"

[User Granted Sudo Rights Or Sudoers Modified]
description = A user added to the sudo or wheel group, or /etc/sudoers written outside visudo.
search = (Image IN ("*/usermod", "*/gpasswd") CommandLine IN ("* sudo*", "* wheel*")) OR (CommandLine="*/etc/sudoers*" CommandLine IN ("*>>*", "*tee *", "*sed -i*"))

[SSH Brute Force From One Source]
description = Eight or more failed SSH logins from the same source address within five minutes.
search = action="login" outcome="failure" \
 \
| bin _time span=5m \
| stats count as event_count by _time source_ip \
 \
| search event_count >= 8

[EHR VIP Record Opened Without A Care Relationship]
description = A chart flagged VIP (celebrity, employee, public figure) opened by someone outside the patient's care team.
search = action="record_view" patient_flags="*vip*" NOT care_relationship=true

[EHR Break-The-Glass Without Justification]
description = Emergency override of chart restrictions with no justification recorded.
search = action="break_glass" NOT justification=* OR justification=""

[EHR Bulk Patient Record Access]
description = One account opening 40 or more different patient charts within an hour, a pattern of record snooping or staged exfiltration. HIPAA 164.312(b) requires reviewing this audit activity.
search = action="record_view" \
 \
| bin _time span=1h \
| stats dc(patient_id) as value_count by _time user \
 \
| search value_count >= 40
